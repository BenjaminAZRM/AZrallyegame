<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHRONORALLYERACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="theme.css">
<style>



.azbrand{font-family:var(--font-titre);font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:#fff}
.azbrand i{color:var(--accent);font-style:normal}
/* corps de l'app gardé lisible (police UI plutôt que monospace) */
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh}
/* Fond photo (podium de fin de rallye) + voile pour la lisibilité.
   Calque fixe DERRIÈRE l'app (#app). L'en-tête et les cartes passent au-dessus. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    linear-gradient(180deg,
      rgba(10,12,15,.5) 0%,
      rgba(10,12,15,.58) 45%,
      rgba(10,12,15,.78) 100%),
    url('/bg-solo.jpg') center/cover no-repeat;
}
.azbrand{text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hdr{background:rgba(18,21,26,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:10}
.pbar{flex:1;height:4px;border-radius:2px}
.year-block{background:var(--accent);border-radius:10px;padding:8px 18px;text-align:center;flex-shrink:0}
.year-lbl{font-size:10px;color:#7c2d12;text-transform:uppercase;letter-spacing:.1em}
.year-num{font-weight:900;font-size:36px;color:#fff;line-height:1}
.tirage-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px;padding:40px 20px;text-align:center}
.step-label{font-size:12px;color:#9ca3af;margin-bottom:10px;text-transform:uppercase;letter-spacing:.12em}
.step-title{font-family:var(--font-titre);font-size:24px;font-weight:700;color:#fff;margin-bottom:32px;text-transform:uppercase;letter-spacing:.02em}
.tirage-btn{display:inline-block;background:var(--accent);border:2px solid var(--accent-soft);border-radius:12px;padding:16px 44px;font-size:17px;font-weight:900;color:#141414;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 28px rgba(249,115,22,.5);transition:all .15s;font-family:var(--font-titre)}
.tirage-btn:hover{background:var(--accent-soft);transform:scale(1.04)}
.tirage-btn:disabled{background:#374151;border-color:#4b5563;color:#9ca3af;cursor:default;transform:none;box-shadow:none}
.choose-btn{display:inline-block;background:var(--accent);border:2px solid var(--accent-soft);border-radius:12px;padding:16px 44px;font-size:17px;font-weight:900;color:#141414;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 24px rgba(249,115,22,.45);transition:all .15s;font-family:var(--font-titre)}
.choose-btn:hover{background:var(--accent-soft);transform:scale(1.04)}
.tirage-sub{font-size:12px;color:#6b7280;margin-top:14px}
.year-reveal{font-family:var(--font-titre);font-size:72px;font-weight:900;color:#fff;line-height:1;margin:20px 0}
.year-reveal.spin{animation:spinIn .6s ease-out forwards}
@keyframes spinIn{0%{opacity:0;transform:scale(.3) rotate(-10deg);color:var(--accent)}60%{transform:scale(1.15) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0deg);color:#fff}}
.result-row{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:3px;border-radius:6px;border:1px solid var(--line);background:rgba(18,21,26,.72);animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.nav{padding:12px 20px;display:flex;gap:8px}
.nav-btn{flex:1;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:700;cursor:pointer}
.fc-row{display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:3px;border-radius:6px;border:1px solid var(--line);background:rgba(18,21,26,.72)}
.rallye-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:12px 20px}
.rally-card{background:var(--asphalt-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.stats{display:flex;gap:4px;flex-shrink:0}
.stat{text-align:center;min-width:30px}
.stat-k{font-size:9px;color:#6b7280}
.stat-v{font-size:12px;font-weight:700}

/* ============================================================
   ÉCRAN D'ACCUEIL SOLO CARRIÈRE (rRules)
   Réutilise le fond podium global (body::before). Classes sc-*.
   ============================================================ */
.sc-stage{position:relative;min-height:calc(100vh - 81px);display:flex;align-items:center;justify-content:center;padding:48px 20px;overflow:hidden}
.sc-spot{position:absolute;left:50%;top:-150px;transform:translateX(-50%);width:760px;height:420px;pointer-events:none;background:radial-gradient(closest-side,rgba(249,115,22,.16),transparent 72%);filter:blur(6px);z-index:0}
/* Hoardings sponsors (bord de piste) */
/* Carte hero (frosted glass) */
.sc-card{position:relative;z-index:3;width:100%;max-width:468px;text-align:center;padding:44px 38px 34px;border-radius:var(--radius);background:rgba(18,21,26,.82);border:1px solid var(--line);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);box-shadow:0 24px 60px -18px rgba(0,0,0,.7);animation:scRise .55s cubic-bezier(.22,.61,.36,1) both}
@keyframes scRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sc-card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);border-radius:var(--radius) var(--radius) 0 0}
.sc-card h1{font-family:var(--font-titre);font-weight:700;text-transform:uppercase;font-size:clamp(27px,5.4vw,38px);line-height:1.04;letter-spacing:.01em;color:var(--paper)}
.sc-card h1 em{font-style:normal;color:var(--accent)}
.sc-lead{margin-top:18px;font-size:13px;color:var(--fog);line-height:1.6;max-width:380px;margin-left:auto;margin-right:auto}
/* CTA orange (raccord .btn-primary) */
.sc-cta{margin-top:28px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-family:var(--font-titre);text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:15px;padding:16px 28px;border-radius:var(--radius);background:var(--accent);border:1px solid var(--accent);color:#141414;cursor:pointer;box-shadow:0 10px 30px -8px rgba(249,115,22,.55);transition:background .18s ease,transform .12s ease,box-shadow .18s ease}
.sc-cta:hover,.sc-cta:focus-visible{background:var(--accent-soft);border-color:var(--accent-soft);transform:translateY(-1px);box-shadow:0 16px 40px -10px rgba(249,115,22,.6);outline:none}
.sc-cta:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.sc-cta .arw{transition:transform .2s ease}
.sc-cta:hover .arw,.sc-cta:focus-visible .arw{transform:translateX(5px)}
/* Parcours Draft -> Rallyes -> Victoire */
.sc-path{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.sc-path .st{flex:1;text-align:center}
.sc-path .st .n{font-family:var(--font-titre);font-weight:600;font-size:11px;letter-spacing:.16em;color:var(--fog);display:block;margin-bottom:5px}
.sc-path .st .l{font-family:var(--font-titre);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--paper)}
.sc-path .st.active .n{color:var(--accent)}
.sc-path .ar{align-self:center;color:var(--line);font-size:13px;padding-top:2px}
@media(max-width:560px){.sc-stage{padding:32px 16px}.sc-card{padding:36px 24px 28px}}
@media(prefers-reduced-motion:reduce){.sc-card{animation:none}}

/* ============================================================
   ÉCRAN DRAFT SOLO CARRIÈRE (rDraft) — cartes + relance
   ============================================================ */
.pbar.sc-pb-done,.pbar.sc-pb-cur{background:var(--accent)}
.pbar.sc-pb-cur{box-shadow:0 0 10px rgba(249,115,22,.6)}
.pbar.sc-pb-todo{background:#1f2937}
.sc-draft-body{padding:22px 20px 40px;max-width:900px;margin:0 auto}
.sc-tour{font-size:10px;color:var(--fog);text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px}
.sc-consigne{font-family:var(--font-titre);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:22px;color:var(--paper);margin-bottom:6px}
.sc-sub{font-size:12.5px;color:var(--fog);margin-bottom:24px;max-width:560px}
.sc-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sc-dc{position:relative;display:flex;flex-direction:column;background:rgba(18,21,26,.82);border:1px solid var(--line);border-radius:var(--radius);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:18px 20px 16px;cursor:pointer;overflow:hidden;min-height:112px;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.sc-dc::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .18s ease}
.sc-dc:hover,.sc-dc:focus-visible{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 18px 40px -14px rgba(249,115,22,.35);outline:none}
.sc-dc:hover::before,.sc-dc:focus-visible::before{opacity:1}
.sc-dc .idx{position:absolute;top:16px;right:18px;font-family:var(--font-titre);font-size:12px;letter-spacing:.1em;color:var(--line)}
.sc-dc .nom{font-family:var(--font-titre);font-weight:600;text-transform:uppercase;letter-spacing:.01em;font-size:18px;line-height:1.25;color:var(--paper);margin:0 0 6px}
.sc-dc .saison{font-family:var(--font-titre);font-weight:600;text-transform:uppercase;letter-spacing:.01em;font-size:18px;line-height:1.25;color:#b6bcc4}
.sc-dc .pick{margin-top:auto;padding-top:14px;display:inline-flex;align-items:center;gap:7px;font-family:var(--font-titre);text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--accent);opacity:0;transform:translateY(4px);transition:opacity .18s ease,transform .18s ease}
.sc-dc:hover .pick,.sc-dc:focus-visible .pick{opacity:1;transform:none}
.sc-dc .pick .chev{transition:transform .2s ease}
.sc-dc:hover .pick .chev{transform:translateX(4px)}
.sc-reroll-wrap{margin-top:26px;display:flex;justify-content:center}
.sc-reroll{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--asphalt-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 32px;cursor:pointer;transition:border-color .18s ease,background .18s ease,transform .12s ease}
.sc-reroll:hover,.sc-reroll:focus-visible{border-color:var(--accent);background:#1b1f26;transform:translateY(-1px);outline:none}
.sc-reroll .rr-main{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-titre);text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:14px;color:var(--paper)}
.sc-reroll .rr-main .ic{font-size:16px;line-height:1}
.sc-reroll .rr-sub{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog)}
.sc-reroll-used{margin-top:26px;text-align:center;font-size:11px;color:var(--fog);font-style:italic}
@media(max-width:680px){.sc-cards{grid-template-columns:1fr}.sc-dc{min-height:0}.sc-dc .pick{opacity:1;transform:none}}

/* ── Bandeau projecteur de révélation (rSim) ── */
#revealSpot:empty{display:none}
.rv-big{position:relative;display:flex;align-items:center;gap:16px;background:rgba(18,21,26,.92);border:1px solid var(--accent);border-radius:10px;padding:15px 18px;margin-bottom:10px;box-shadow:0 12px 36px -12px rgba(249,115,22,.5);animation:rvSpotIn .45s cubic-bezier(.22,.61,.36,1) both}
.rv-big::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);border-radius:10px 10px 0 0}
.rv-big.you{border-color:#7c3aed}
@keyframes rvSpotIn{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.rv-rank{font-family:var(--font-titre);font-weight:700;font-size:24px;line-height:1;color:var(--accent);min-width:46px;text-align:center}
.rv-big.you .rv-rank{color:#c4b5fd}
.rv-big.lead .rv-rank{color:var(--accent-soft)}
.rv-rank .p{font-size:13px;color:var(--fog);margin-right:2px;vertical-align:top}
.rv-mid{flex:1;min-width:0}
.rv-lbl{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--fog);margin-bottom:2px}
.rv-nom{font-family:var(--font-titre);font-weight:600;text-transform:uppercase;letter-spacing:.01em;font-size:15px;line-height:1.1;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-big.you .rv-nom{color:#c4b5fd}
.rv-gap{text-align:right;min-width:86px}
.rv-gv{font-family:monospace;font-weight:700;font-size:14px;color:var(--paper)}
.rv-big.lead .rv-gv{color:var(--accent-soft)}
.rv-gl{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);margin-top:2px}

/* ── Page classement du championnat (rChamp) ── */
.champ-wrap{max-width:620px;margin:0 auto;padding:22px 20px 40px}
.champ-eyebrow{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.16em;margin-bottom:6px}
.champ-eyebrow.fin{color:#f97316;font-weight:700}
.champ-title{font-family:'Chakra Petch',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:26px;color:#fff;margin-bottom:22px}
.champ-board{display:flex;flex-direction:column;gap:7px;margin-bottom:26px}
.crow{display:flex;align-items:center;gap:12px;background:#0f1117;border:1px solid #1f2937;border-radius:9px;padding:12px 15px}
.crow.you{background:#1a1020;border-color:#7c3aed}
.crow.lead{border-color:rgba(249,115,22,.5)}
.crow .crk{width:24px;text-align:right;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:15px;color:#6b7280;flex-shrink:0}
.crow.you .crk{color:#c4b5fd}
.crow.lead .crk{color:#fdba74}
.crow .cnm{flex:1;min-width:0;font-family:'Chakra Petch',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.01em;font-size:15px;color:#eceef1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow.you .cnm{color:#c4b5fd}
.crow .cpts{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:16px;color:#fdba74;min-width:44px;text-align:right}
.crow.you .cpts{color:#c4b5fd}
.champ-actions{display:flex;gap:12px;align-items:center}
.cbtn-next{flex:2;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:15px;padding:16px 24px;border-radius:12px;background:#f97316;border:1px solid #f97316;color:#141414;cursor:pointer;box-shadow:0 10px 30px -8px rgba(249,115,22,.5);transition:background .18s,transform .12s}
.cbtn-next:hover{background:#fdba74;transform:translateY(-1px)}
.cbtn-back{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:12px;padding:16px 18px;border-radius:12px;background:#15181d;border:1px solid #2a2f37;color:#8b929c;cursor:pointer;transition:border-color .18s,color .18s}
.cbtn-back:hover{border-color:#f97316;color:#eceef1}
.skip-btn{background:#15181d;border:1px solid #2a2f37;color:#8b929c;font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:12px;padding:11px 22px;border-radius:10px;cursor:pointer;transition:border-color .18s,color .18s}
.skip-btn:hover{border-color:#f97316;color:#eceef1}

/* ── Fin de championnat : record perso + top 10 de la saison (rResults) ── */
.cl-sec{padding:14px 20px 0}
.cl-lbl{font-size:10px;color:#b6bcc4;text-shadow:0 1px 6px rgba(0,0,0,.9);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.cl-lbl b{color:var(--accent);font-weight:700}
.rec-card{position:relative;display:flex;align-items:center;gap:16px;background:rgba(18,21,26,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;overflow:hidden}
.rec-card.new{border-color:var(--accent);box-shadow:0 12px 36px -14px rgba(249,115,22,.45)}
.rec-card.new::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.rec-pts{font-family:var(--font-titre);font-weight:700;font-size:36px;line-height:1;color:var(--paper);flex-shrink:0}
.rec-pts small{font-size:13px;color:var(--fog);margin-left:3px;font-weight:600}
.rec-mid{flex:1;min-width:0}
.rec-t{font-family:var(--font-titre);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:13px;color:var(--paper)}
.rec-s{font-size:12px;color:var(--fog);margin-top:3px}
.rec-s b{color:var(--paper);font-weight:600}
.rec-badge{flex-shrink:0;font-family:var(--font-titre);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px;background:var(--accent);color:#141414;border-radius:6px;padding:6px 10px}
.t10{display:flex;flex-direction:column;gap:5px}
.t10-row{display:flex;align-items:center;gap:12px;background:rgba(15,17,23,.86);border:1px solid #1f2937;border-radius:9px;padding:11px 14px}
.t10-row.lead{border-color:rgba(249,115,22,.5)}
.t10-row.you{background:#1a1020;border-color:#7c3aed}
.t10-row.cur{box-shadow:inset 3px 0 0 var(--accent)}
.t10-rk{width:24px;text-align:right;font-family:var(--font-titre);font-weight:700;font-size:15px;color:#6b7280;flex-shrink:0}
.t10-row.lead .t10-rk{color:#fdba74}
.t10-row.you .t10-rk{color:#c4b5fd}
.t10-mid{flex:1;min-width:0}
.t10-nm{display:flex;align-items:center;gap:8px;font-family:var(--font-titre);font-weight:600;text-transform:uppercase;letter-spacing:.01em;font-size:14px;color:#eceef1;line-height:1.2}
.t10-nm .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t10-row.you .t10-nm{color:#c4b5fd}
.t10-tag{flex-shrink:0;font-size:9px;letter-spacing:.1em;color:var(--accent);border:1px solid rgba(249,115,22,.55);border-radius:5px;padding:1px 6px}
.t10-pts{font-family:var(--font-titre);font-weight:700;font-size:16px;color:#fdba74;min-width:44px;text-align:right;flex-shrink:0}
.t10-row.you .t10-pts{color:#c4b5fd}
.t10-empty{font-size:12px;color:var(--fog);padding:12px 2px}
@media(max-width:480px){.rec-card{flex-wrap:wrap;gap:10px 14px}.rec-pts{font-size:30px}.rec-mid{flex:1 1 170px}}
/* ── Palmarès du joueur : meilleur résultat sur chaque saison (accueil + fin de championnat) ── */
.sc-stage{flex-direction:column;gap:18px}
.pal-card{position:relative;z-index:3;width:100%;max-width:468px;border-radius:var(--radius);background:rgba(18,21,26,.82);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 24px 60px -18px rgba(0,0,0,.7);padding:18px 18px 10px}
.pal-card.fin{max-width:none;box-shadow:none}
.pal-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.pal-h{font-family:var(--font-titre);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--paper)}
.pal-n{font-size:11px;color:var(--fog)}
.pal-n b{color:var(--accent);font-weight:700}
.pal-tb{width:100%;border-collapse:collapse}
.pal-tb th{font-size:10px;font-weight:400;color:#b6bcc4;text-transform:uppercase;letter-spacing:.1em;text-align:right;padding:0 10px 8px;border-bottom:1px solid var(--line)}
.pal-tb th:first-child{text-align:left}
.pal-tb td{padding:9px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.06);font-family:var(--font-titre);font-variant-numeric:tabular-nums}
.pal-tb tr:last-child td{border-bottom:none}
.pal-tb td:first-child{text-align:left;font-weight:700;font-size:15px;color:var(--paper)}
.pal-rk{font-weight:600;font-size:14px;color:#eceef1}
.pal-rk small{font-size:11px;color:var(--fog);font-weight:400;margin-left:4px}
.pal-tb tr.lead .pal-rk{color:var(--accent);font-weight:700}
.pal-pts{font-weight:700;font-size:15px;color:#fdba74}
.pal-pts small{font-size:11px;color:var(--fog);font-weight:600;margin-left:3px}
.pal-tb tr.vide td{color:#4b5563}
.pal-tb tr.vide td:first-child{color:#6b7280;font-weight:600}
.pal-tb tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.pal-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;padding:10px 0 4px;border-top:1px solid var(--line)}
.pal-rg{font-family:var(--font-titre);font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--fog);font-variant-numeric:tabular-nums}
.pal-ar{width:44px;height:36px;display:inline-flex;align-items:center;justify-content:center;background:#15181d;border:1px solid #2a2f37;border-radius:10px;color:#eceef1;font-size:16px;cursor:pointer;transition:border-color .18s,color .18s,transform .12s}
.pal-ar:hover:not(:disabled){border-color:#f97316;color:#f97316;transform:translateY(-1px)}
.pal-ar:disabled{opacity:.3;cursor:default}
/* ── Fin de championnat : carte « Ta saison » (résultat de la partie + rang parmi les joueurs) ── */
.ts-card{position:relative;background:rgba(18,21,26,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--radius);padding:18px;overflow:hidden}
.ts-card.new{border-color:var(--accent);box-shadow:0 12px 36px -14px rgba(249,115,22,.45)}
.ts-card.new::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.ts-main{display:flex;align-items:center;gap:16px}
.ts-pts{font-family:var(--font-titre);font-weight:700;font-size:40px;line-height:1;color:var(--paper);flex-shrink:0}
.ts-pts small{font-size:13px;color:var(--fog);margin-left:3px;font-weight:600}
.ts-mid{flex:1;min-width:0}
.ts-t{font-family:var(--font-titre);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:17px;color:var(--paper)}
.ts-t.champ{color:var(--accent)}
.ts-s{font-size:12px;color:var(--fog);margin-top:4px}
.ts-rec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--fog)}
.ts-rec b{color:var(--paper);font-weight:600}
.ts-go{margin-top:12px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-titre);text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:15px;padding:15px 24px;border-radius:var(--radius);background:var(--accent);border:1px solid var(--accent);color:#141414;cursor:pointer;box-shadow:0 10px 30px -8px rgba(249,115,22,.5);transition:background .18s,transform .12s}
.ts-go:hover{background:#fdba74;transform:translateY(-1px)}
@media(max-width:480px){.ts-main{flex-wrap:wrap;gap:10px 14px}.ts-pts{font-size:34px}.ts-mid{flex:1 1 170px}}
.t10-sep{text-align:center;color:#6b7280;font-size:12px;letter-spacing:.3em;line-height:1;padding:2px 0}
.cat-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;max-width:min(92vw,420px);background:rgba(18,21,26,.95);border:1px solid #dc2626;border-radius:10px;padding:11px 16px;font-size:13px;color:#eceef1;box-shadow:0 12px 32px -10px rgba(0,0,0,.7)}
</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0e1013"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="ChronoRallye"></head><body>
<div id="app"></div>
<script src="solo-data.js"></script>
<script>
const RALLYES=window.SOLO_RALLYES;
const DATA=window.SOLO_DATA;
const YEARS=Object.keys(DATA).map(Number);
const PTS=[25,18,15,12,10,8,6,4,2,1];
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function rndN(a,n){const c=[...a],r=[];for(let i=0;i<n&&c.length;i++){const x=Math.floor(Math.random()*c.length);r.push(c.splice(x,1)[0]);}return r;}
function sc(e,r){return(e.asp*r.asp+e.ter*r.ter+e.nei*r.nei+e.sec*r.sec+e.plu*r.plu+e.rap*r.rap+e.sin*r.sin)/3;}
function basePerf(d,c,v,r){return((sc(d,r)+sc(c,r)+sc(v,r))/3)*(1+(Math.random()*.04-.02));}
function teamFib(e){const v=[];if(e.driver&&typeof e.driver.fib==="number")v.push(e.driver.fib);if(e.codr&&typeof e.codr.fib==="number")v.push(e.codr.fib);if(e.car&&typeof e.car.fib==="number")v.push(e.car.fib);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0.85;}
function calcInc(fib,r){const risk=(1-fib)*(1+r.cas),t=Math.random();if(t>risk)return{type:"OK",pen:0};if(t>risk*.67)return{type:"Crevaison",pen:30};if(t>risk*.33)return{type:"Panne",pen:60};return{type:"Abandon",pen:Infinity};}
function fmtG(s){if(s===0)return"-";if(s>=60){const m=Math.floor(s/60),x=(s%60).toFixed(1);return`+${m}m${x.padStart(4,"0")}s`;}return`+${s.toFixed(1)}s`;}
function scol(s){
  if(s.includes("Neige")&&s.includes("Asp"))return"#94a3b8"; // mixte
  if(s.includes("Neige"))return"#f1f5f9";   // blanc neige
  if(s.includes("Asp"))return"#9ca3af";     // gris asphalte
  return"#a16207";                          // marron terre
}
function scolBg(s){
  if(s.includes("Neige")&&s.includes("Asp"))return"#1e2432";
  if(s.includes("Neige"))return"#1e2432";
  if(s.includes("Asp"))return"#1c1c1e";
  return"#1a1208";
}
function vCol(v){return v>=90?"#f59e0b":v>=85?"#60a5fa":"#9ca3af";}
function coS(d){if(!d)return{asp:80,ter:80,nei:80,sec:80,plu:80,rap:80,sin:80,fib:0.85,nom:""};return{asp:d.casp||80,ter:d.cter||80,nei:d.cnei||80,sec:d.csec||80,plu:d.cplu||80,rap:d.crap||80,sin:d.csin||80,fib:d.cfib||0.85,nom:d.cop||""};}

let ST={phase:"rules",draftRound:0,draftOffers:[],rerollUsed:false,riskLevel:null,sel:{},drawn:[],results:[],cur:0,champ:{},showNotes:false,revealed:0,revealing:false,maxReached:0,launching:false,playerName:"",aEmail:false,emailVerifie:true,verrou:false,busy:false,fin:null,classement:null};
function statEvent(type){
  try{
    var tok='';try{tok=localStorage.getItem('azr_token')||'';}catch(e){}
    fetch('/api/stats/evenement',{
      method:'POST',keepalive:true,
      headers:{'Content-Type':'application/json','Authorization':tok?('Bearer '+tok):''},
      body:JSON.stringify({jeu:'course-au-titre',type:type})
    }).catch(function(){});
  }catch(e){}
}
let revealTimer=null;
let revealSeq=0;
const revealEls=new Map();
const RV_APPEAR=450,RV_HOLD=700,RV_SLIDE=650,RV_GAP=350;
const rvWait=ms=>new Promise(res=>{revealTimer=setTimeout(res,ms);});
function stopReveal(){revealSeq++;if(revealTimer){clearTimeout(revealTimer);clearInterval(revealTimer);revealTimer=null;}ST.revealing=false;}

function init(){
  var _u,_t;
  try{_u=localStorage.getItem('azr_user');_t=localStorage.getItem('azr_token')||'';}catch(e){}
  if(!_u){location.replace('/connexion.html?next=/championnat.html');return;}
  ST.playerName=_u;ST.phase="rules";ST.draftRound=0;ST.draftOffers=[];ST.rerollUsed=false;ST.riskLevel=null;ST.sel={};
  render();
  chargerPalmares();
  // Un compte dont l'e-mail n'est pas vérifié ne peut pas lancer de partie
  try{
    fetch('/api/me',{headers:{'Authorization':_t?('Bearer '+_t):''}})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok){
          ST.aEmail=!!d.aEmail; ST.emailVerifie=!!d.email_verifie;
          ST.verrou = ST.aEmail && !ST.emailVerifie;
          if(ST.verrou && ST.phase==="rules") render();
        }
      }).catch(function(){});
  }catch(e){}
}

// ── Le serveur tire les propositions et simule les rallyes (anti-triche) ──
function apiCat(url,body){
  var tok='';try{tok=localStorage.getItem('azr_token')||'';}catch(e){}
  var opt={method:body===undefined?'GET':'POST',headers:{'Authorization':tok?('Bearer '+tok):''}};
  if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  return fetch(url,opt).then(function(r){
    return r.json().catch(function(){return null;}).then(function(d){
      if(r.status===401){location.replace('/connexion.html?next=/championnat.html');}
      if(!r.ok||!d||!d.ok)throw new Error((d&&d.error)||"Serveur injoignable. Réessaie.");
      return d;
    });
  },function(){throw new Error("Serveur injoignable. Vérifie ta connexion.");});
}
let toastTimer=null;
function toastCat(msg){
  let t=document.getElementById("catToast");
  if(!t){t=document.createElement("div");t.id="catToast";t.className="cat-toast";document.body.appendChild(t);}
  t.textContent=msg;t.style.display="block";
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.style.display="none";},4500);
}
// Applique l'état du draft renvoyé par le serveur
function appliquerDraft(d){
  ST.draftRound=d.round;ST.rerollUsed=!!d.rerollUsed;ST.draftOffers=d.offers||[];
  const s=d.sel||{};ST.sel={};
  if(s.driver){ST.sel.driver=s.driver;ST.sel.driverYear=s.driverYear;}
  if(s.codr){ST.sel.codr=coS(s.codr);ST.sel.codrYear=s.codrYear;}
  if(s.car){ST.sel.car=s.car;ST.sel.carYear=s.carYear;}
  if(d.rallyes){ST.drawn=d.rallyes;ST.results=d.rallyes.map(r=>({r,sorted:null}));ST.champ={};}
}
// Charge le top 10 de la saison + le record perso (écran final)
function chargerClassement(){
  if(ST.classement||!ST.fin)return;
  const fin=ST.fin;
  apiCat('/api/cat/classement?saison='+encodeURIComponent(ST.sel.carYear)+'&partie='+encodeURIComponent(fin.id))
    .then(d=>{if(ST.fin!==fin)return;ST.classement=d;if(ST.phase==="results")render();})
    .catch(()=>{if(ST.fin!==fin)return;ST.classement={erreur:true};if(ST.phase==="results")render();});
}

// Charge le palmarès du joueur (accueil + écran final)
let palmaresEnCours=false;
function chargerPalmares(){
  if(ST.palmares||palmaresEnCours)return;
  palmaresEnCours=true;
  apiCat('/api/cat/palmares')
    .then(d=>{palmaresEnCours=false;ST.palmares=d;if(ST.phase==="rules"||ST.phase==="results")render();})
    .catch(()=>{palmaresEnCours=false;ST.palmares={erreur:true};});
}

function champSoFar(){
  const map={};
  for(let i=0;i<=ST.cur;i++) ST.results[i].sorted.forEach(e=>{map[e.id]=(map[e.id]||0)+e.pts;});
  return Object.entries(map).map(([id,pts])=>({id,pts})).sort((a,b)=>b.pts-a.pts);
}
function champFinal(){return Object.entries(ST.champ).map(([id,pts])=>({id,pts})).sort((a,b)=>b.pts-a.pts);}

function revealNavChamp(){
  setTimeout(()=>{
    const nav=document.getElementById("simNav");
    if(nav){nav.style.transition="opacity .6s";nav.style.opacity="1";nav.style.pointerEvents="auto";}
    const sk=document.getElementById("skipRow");if(sk)sk.style.display="none";
  },400);
}

function champBefore(){const map={};for(let i=0;i<ST.cur;i++)ST.results[i].sorted.forEach(e=>{map[e.id]=(map[e.id]||0)+e.pts;});return map;}
function buildRevealOrder(sorted){
  const arr=[...sorted];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  if(ST.cur===0)return arr;                       // 1er rallye : aléatoire
  const pts=champBefore();                         // rallyes suivants : inverse du championnat
  arr.sort((a,b)=>(pts[a.id]||0)-(pts[b.id]||0));  // dernier au général révélé en premier
  return arr;
}

let revealOrder=[];
let revealedEntries=[];

function makeRowWithGap(e,provRank,provGap,provPts,allRevealed){
  const div=document.createElement("div");
  div.className="result-row";div.dataset.id=e.id;
  fillRow(div,e,provRank,provGap,provPts,allRevealed);
  return div;
}
function fillRow(div,e,provRank,provGap,provPts,allRevealed){
  const dnf=e.isDNF,isP=e.isP;
  const hasPen=e.inc?.type==="Crevaison"||e.inc?.type==="Panne";
  const isWinner=!dnf&&(e.rank===1)&&!!allRevealed;
  const isProvLead=!dnf&&!allRevealed&&provGap===0;
  if(provPts===undefined){const PTS_SCALE=[25,18,15,12,10,8,6,4,2,1];provPts=dnf?0:(typeof provRank==="number"?PTS_SCALE[provRank-1]||0:0);}
  const _topName=isP?(ST.playerName||"Joueur"):e.nom;
  const _subLine=isP?`${(e.driver&&e.driver.nom)||e.nom}${e.cop?" · "+e.cop:""}${e.car?" · "+e.car.nom:""}`:`${e.cop}${e.car?" · "+e.car.nom:""}`;
  const rightTxt=dnf?"Abandon":isWinner?"✓ Vainqueur":isProvLead?"Leader":fmtG(provGap);
  div.style.cssText=`background:${isP?"#1a1020":"#0f1117"};border:1px solid ${isP?"#7c3aed":"#1f2937"};opacity:${dnf?.6:1}`;
  div.innerHTML=`
    <span style="width:22px;text-align:right;font-size:12px;font-weight:700;color:${dnf?"#4b5563":"#6b7280"};flex-shrink:0">${dnf?"DNF":provRank}</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:12px;font-weight:${isP?700:500};color:${isP?"#c4b5fd":"#e5e7eb"}">${_topName}</div>
      <div style="font-size:10px;color:#6b7280">${_subLine}</div>
    </div>
    ${hasPen?`<span style="font-size:9px;color:${e.inc.type==="Crevaison"?"#fbbf24":"#f97316"};background:#1f2937;padding:1px 5px;border-radius:3px;flex-shrink:0">${e.inc.type}</span>`:""}
    <div style="text-align:right;min-width:65px;flex-shrink:0">
      <div style="font-size:11px;font-family:monospace;color:${dnf?"#ef4444":isProvLead?"#fdba74":"#9ca3af"}">${rightTxt}</div>
      ${provPts>0?`<div style="font-size:11px;color:#60a5fa;font-weight:600">+${provPts} pts</div>`:""}
    </div>`;
}

function makeRow(e,finalRank){return makeRowWithGap(e,finalRank,e.gap);}

function rebuildList(){
  const container=document.getElementById("revealList");
  if(!container)return;
  const sorted=[...revealedEntries].sort((a,b)=>{
    if(a.isDNF&&!b.isDNF)return 1;if(!a.isDNF&&b.isDNF)return -1;return a.rank-b.rank;
  });
  container.innerHTML="";
  sorted.forEach((e,i)=>{const div=makeRow(e,e.isDNF?"DNF":i+1);div.style.animation="none";container.appendChild(div);});
}

function computeProv(list){
  const PTS=[25,18,15,12,10,8,6,4,2,1];
  const finishers=list.filter(x=>!x.isDNF).sort((a,b)=>a.rank-b.rank);
  const dnfs=list.filter(x=>x.isDNF);
  const trueWinner=finishers.some(x=>x.rank===1);
  const leader=finishers[0];
  return [...finishers,...dnfs].map((entry,i)=>{
    const isDNF=entry.isDNF;
    const gap=isDNF?Infinity:(trueWinner?entry.gap:entry.gap-leader.gap);
    return {entry,provRank:isDNF?"DNF":i+1,provGap:gap,provPts:isDNF?0:(PTS[i]||0)};
  });
}

function bigSpotCard(e,provRank,provGap){
  const dnf=e.isDNF,isP=e.isP;
  const lead=!dnf&&provGap===0;
  const nom=isP?(ST.playerName||"Joueur"):e.nom;
  const gv=dnf?"Abandon":lead?"Leader":fmtG(provGap);
  const gl=dnf?"":lead?"meilleur temps":"écart au 1er";
  return `<div class="rv-big${lead?" lead":""}${isP?" you":""}">
    <div class="rv-rank">${dnf?"DNF":`<span class="p">P</span>${provRank}`}</div>
    <div class="rv-mid"><div class="rv-lbl">Position provisoire</div><div class="rv-nom">${nom}</div></div>
    <div class="rv-gap"><div class="rv-gv">${gv}</div><div class="rv-gl">${gl}</div></div>
  </div>`;
}

function renderRevealFinal(container){
  const rows=computeProv(revealedEntries);
  container.innerHTML="";
  rows.forEach(r=>{const div=makeRowWithGap(r.entry,r.provRank,r.provGap,r.provPts,true);div.style.animation="none";container.appendChild(div);});
}

function flipInsert(container,rows,curId,fromRect){
  if(!container)return;
  const firsts=new Map();
  revealEls.forEach((el,id)=>firsts.set(id,el.getBoundingClientRect()));
  rows.forEach(r=>{
    let el=revealEls.get(r.entry.id);
    if(!el){el=makeRowWithGap(r.entry,r.provRank,r.provGap,r.provPts,false);el.style.animation="none";revealEls.set(r.entry.id,el);}
    else{fillRow(el,r.entry,r.provRank,r.provGap,r.provPts,false);}
  });
  rows.forEach(r=>container.appendChild(revealEls.get(r.entry.id)));
  firsts.forEach((first,id)=>{
    const el=revealEls.get(id);if(!el)return;
    const last=el.getBoundingClientRect();const dy=first.top-last.top;
    if(dy){el.style.transition="none";el.style.transform=`translateY(${dy}px)`;
      requestAnimationFrame(()=>{el.style.transition=`transform ${RV_SLIDE}ms cubic-bezier(.22,.61,.36,1)`;el.style.transform="";});}
  });
  const line=revealEls.get(curId);
  if(line&&fromRect){
    const to=line.getBoundingClientRect();const dy=fromRect.top-to.top;
    line.style.transition="none";line.style.opacity="1";line.style.transform=`translateY(${dy}px)`;
    requestAnimationFrame(()=>{line.style.transition=`transform ${RV_SLIDE}ms cubic-bezier(.22,.61,.36,1)`;line.style.transform="";});
  }
}

function skipReveal(){
  stopReveal();
  const rr=ST.results[ST.cur];
  revealedEntries=[...rr.sorted];
  ST.revealed=revealedEntries.length;
  ST.revealing=false;
  const spot=document.getElementById("revealSpot");if(spot)spot.innerHTML="";
  const container=document.getElementById("revealList");if(container)renderRevealFinal(container);
  const ctr=document.getElementById("revealCounter");if(ctr)ctr.textContent="";
  const sk=document.getElementById("skipRow");if(sk)sk.style.display="none";
  revealNavChamp();
}

function startReveal(instant){
  stopReveal();
  const myRun=revealSeq;
  ST.revealed=0;ST.revealing=true;revealedEntries=[];revealEls.clear();
  const spot=document.getElementById("revealSpot");
  const container=document.getElementById("revealList");
  if(spot)spot.innerHTML="";
  if(container)container.innerHTML="";
  const sorted=ST.results[ST.cur].sorted;
  const total=sorted.length;
  if(instant){
    revealedEntries=[...sorted];ST.revealed=total;ST.revealing=false;
    var sk0=document.getElementById("skipRow");if(sk0)sk0.style.display="none";
    if(container)renderRevealFinal(container);
    const ctr=document.getElementById("revealCounter");if(ctr)ctr.textContent="";
    revealNavChamp();return;
  }
  revealOrder=buildRevealOrder(sorted);
  (async()=>{
    if(!revealOrder.length)return;
    const STEP=RV_APPEAR+RV_HOLD;                       // durée d'affichage projecteur avant glissement
    const showSpot=(e)=>{
      const rows=computeProv([...revealedEntries,e]);   // position provisoire si e était inséré
      const cur=rows.find(r=>r.entry.id===e.id);
      if(spot)spot.innerHTML=bigSpotCard(e,cur.provRank,cur.provGap);
      const ctr=document.getElementById("revealCounter");
      if(ctr){const reste=total-ST.revealed;ctr.textContent=reste>0?`${reste} équipage${reste>1?"s":""} restant${reste>1?"s":""}...`:"";}
      return spot?spot.querySelector(".rv-big"):null;
    };
    let bigEl=showSpot(revealOrder[0]);
    for(let k=0;k<revealOrder.length;k++){
      if(myRun!==revealSeq)return;
      await rvWait(STEP);
      if(myRun!==revealSeq)return;
      const e=revealOrder[k];
      const fromRect=bigEl?bigEl.getBoundingClientRect():null;   // départ du glissement = position projecteur
      revealedEntries.push(e);ST.revealed++;
      const rows=computeProv(revealedEntries);
      flipInsert(container,rows,e.id,fromRect);                  // la ligne glisse à sa place
      bigEl=(k+1<revealOrder.length)?showSpot(revealOrder[k+1]):null; // le suivant apparaît aussitôt
    }
    await rvWait(RV_SLIDE);                              // laisser finir le dernier glissement
    if(myRun!==revealSeq)return;
    ST.revealing=false;
    if(spot)spot.innerHTML="";
    if(container)renderRevealFinal(container);
    const ctr2=document.getElementById("revealCounter");if(ctr2)ctr2.textContent="";
    revealNavChamp();
  })();
}

function selectDraft(idx){
  if(ST.busy)return;ST.busy=true;
  apiCat('/api/cat/draft/choix',{idx:idx})
    .then(d=>{
      ST.busy=false;appliquerDraft(d);
      // Les 3 éléments sont choisis → la saison est tirée par le serveur
      if(d.rallyes){
        ST._finEnvoye=false;statEvent('draft');
        ST.fin=null;ST.classement=null;
        ST.phase="recap";ST.cur=0;ST.revealed=0;ST.maxReached=0;render();return;
      }
      render();
    })
    .catch(e=>{ST.busy=false;toastCat(e.message);});
}

function goToRally(idx){
  stopReveal();
  const rr=ST.results[idx];if(!rr)return;
  if(rr.sorted){ST.cur=idx;ST.revealed=0;ST.phase="sim";render();startReveal(true);return;} // rallye déjà couru : on le revoit
  if(idx!==ST.results.findIndex(x=>!x.sorted))return;                                       // seul le prochain rallye peut être lancé
  ST.cur=idx;ST.revealed=0;ST.maxReached=Math.max(ST.maxReached,idx);
  ST.phase="launch";ST.riskLevel=null;render();
}

let phaseAffichee=null;
function render(){
  const app=document.getElementById("app");
  const nouvelEcran=ST.phase!==phaseAffichee;phaseAffichee=ST.phase;
  if(ST.phase==="rules"){app.innerHTML=rRules();attachRulesEv();}
  else if(ST.phase==="draft"){app.innerHTML=rDraft();attachDraftEv();}
  else if(ST.phase==="recap"){app.innerHTML=rRecap();attachRecapEv();}
  else if(ST.phase==="launch"){app.innerHTML=rLaunch();attachLaunchEv();}
  else if(ST.phase==="sim"){app.innerHTML=rSim();attachSimEv();}
  else if(ST.phase==="champ"){app.innerHTML=rChamp();attachChampEv();}
  else{app.innerHTML=rResults();attachEv();}
  // Changement d'écran : on repart toujours du haut de la page
  if(nouvelEcran)window.scrollTo(0,0);
}

const KEYS=["asp","ter","nei","sec","plu","rap","sin"];
const LABELS={asp:"Asphalte",ter:"Terre",nei:"Neige",sec:"Sec",plu:"Pluie",rap:"Rapide",sin:"Sinueux"};

function rRecap(){
  const d=ST.sel.driver,c=ST.sel.codr,v=ST.sel.car;

  function getDriverStats(nom,yr){
    const yd=DATA[yr];if(!yd)return null;
    return yd.drivers.find(x=>x.nom===nom)||null;
  }
  function getCopiloteStats(nom,yr){
    const yd=DATA[yr];if(!yd)return null;
    const row=yd.drivers.find(x=>x.cop===nom);
    if(!row)return null;
    return{asp:row.casp,ter:row.cter,nei:row.cnei,sec:row.csec,plu:row.cplu,rap:row.crap,sin:row.csin};
  }
  function getCarStats(nom,yr){
    const yd=DATA[yr];if(!yd)return null;
    return yd.cars.find(x=>x.nom===nom)||null;
  }

  // Récupère les stats avec fallbacks robustes
  const dStats=getDriverStats(d&&d.nom,ST.sel.driverYear)||d||{asp:80,ter:80,nei:80,sec:80,plu:80,rap:80,sin:80};
  const cStats=getCopiloteStats(c&&c.nom,ST.sel.codrYear)||c||{asp:80,ter:80,nei:80,sec:80,plu:80,rap:80,sin:80};
  const vStats=getCarStats(v&&v.nom,ST.sel.carYear)||v||{asp:80,ter:80,nei:80,sec:80,plu:80,rap:80,sin:80};

  // Moyenne des 3 items sur les 7 caractéristiques
  const avg={};
  KEYS.forEach(k=>{
    const dv=Number(dStats[k])||80, cv=Number(cStats[k])||80, vv=Number(vStats[k])||80;
    avg[k]=Math.round((dv+cv+vv)/3);
  });

  // Point fort et faible de l'ensemble
  let best=KEYS[0],worst=KEYS[0];
  KEYS.forEach(k=>{
    if(avg[k]>avg[best])best=k;
    if(avg[k]<avg[worst])worst=k;
  });

  const bloc=(title,nom,annee)=>`
    <div style="background:#0f1117;border:1px solid #1f2937;border-radius:10px;padding:14px 16px;margin-bottom:12px">

      <a href="/" class="mark"><img src="/logo.svg" alt="" class="brand-logo"><span class="brand-txt"><span class="c1">CHRONO</span><span class="c2">RALLYE</span><span class="c3">RACE</span></span></a>
    </div>
    <div style="display:flex;gap:5px">${[0,1,2].map(()=>`<div class="pbar" style="background:#dc2626"></div>`).join("")}</div>
  </div>
  <div style="padding:16px 20px 24px">
    <div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px">Votre composition</div>
    <div style="font-weight:800;font-size:20px;color:#fff;margin-bottom:16px">Récapitulatif du draft</div>

    ${bloc("Pilote",d.nom,ST.sel.driverYear)}
    ${bloc("Copilote",c.nom,ST.sel.codrYear)}
    ${bloc("Voiture",v.nom,ST.sel.carYear)}

    <div style="background:#0f1117;border:1px solid #374151;border-radius:10px;padding:14px 16px;margin-bottom:12px">
      <div style="font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px">Force de l'équipage</div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;background:#0a1a0a;border:1px solid #166534;border-radius:8px;padding:10px 12px">
          <div style="font-size:9px;color:#4ade80;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Point fort</div>
          <div style="font-weight:700;font-size:15px;color:#f0fdf4">${LABELS[best]}</div>
          
        </div>
        <div style="flex:1;background:#1a0a0a;border:1px solid #991b1b;border-radius:8px;padding:10px 12px">
          <div style="font-size:9px;color:#f87171;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Point faible</div>
          <div style="font-weight:700;font-size:15px;color:#fef2f2">${LABELS[worst]}</div>

    const isP=e.id==="JOUEUR",isLead=i===0;
    const nom=isP?(ST.playerName||"Joueur"):e.id;
    return`<div class="crow${isP?" you":""}${isLead?" lead":""}"><span class="crk">${i+1}</span><span class="cnm">${nom}</span><span class="cpts">${e.pts}</span></div>`;
  }).join("");
  const nextBtn=isLast
    ?`<button class="cbtn-next" id="toResults">Bilan de la saison →</button>`
    :`<button class="cbtn-next" id="toNext">Rallye suivant →</button>`;
  return`<div class="hdr">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <a href="/" class="mark"><img src="/logo.svg" alt="" class="brand-logo"><span class="brand-txt"><span class="c1">CHRONO</span><span class="c2">RALLYE</span><span class="c3">RACE</span></span></a>
    </div>
    <div style="display:flex;gap:5px">${bars}</div>
  </div>
  <div class="champ-wrap">
    ${isLast
      ?`<div class="champ-eyebrow fin">Saison ${ST.sel.carYear} terminée · ${ST.results.length} rallyes sur ${ST.results.length}</div>
    <div class="champ-title">Classement <span style="color:#f97316">final</span> du championnat</div>`
      :`<div class="champ-eyebrow">Après ${ST.cur+1} rallye${ST.cur>0?"s":""} sur ${ST.results.length}</div>
    <div class="champ-title">Classement du <span style="color:#f97316">championnat</span></div>`}
    <div class="champ-board">${rows}</div>
    <div class="champ-actions">
      <button class="cbtn-back" id="backSim">← Revoir le rallye</button>
      ${nextBtn}
    </div>
  </div>`;
}

function attachChampEv(){
  const back=document.getElementById("backSim");
  if(back)back.addEventListener("click",()=>{ST.phase="sim";render();startReveal(true);});
  const next=document.getElementById("toNext");
  if(next)next.addEventListener("click",()=>goToRally(ST.cur+1));
  const fin=document.getElementById("toResults");
  if(fin)fin.addEventListener("click",()=>{if(!ST._finEnvoye){ST._finEnvoye=true;statEvent('fin');}ST.phase="results";render();chargerClassement();chargerPalmares();});
}

// ── Fin de championnat : carte « Ta saison » + top 10 de la saison + palmarès ──
// ST.classement = null (chargement) | {erreur:true} | {saison, top:[{pseudo,pts,moi,cettePartie}] (une ligne par joueur), perso:{pts,rang,nbJoueurs,nouveau}, partie:{pts,rang}}
function escH(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function rangTxt(n){return n===1?"1er":n+"e";}
// ── Palmarès : meilleur résultat du joueur sur chaque saison (accueil + fin de championnat) ──
// ST.palmares = null (pas encore chargé) | {erreur:true} | {saisons:[{saison,pts,rang}]} — rang = sa meilleure place au championnat, pts = son meilleur total (records indépendants) ; pts null = saison jamais terminée
// 8 saisons affichées à la fois ; les flèches font défiler les suivantes / précédentes.
// saisonCourante : saison qui vient d'être jouée (repère orange), uniquement sur l'écran final
const PAL_NB=8;
let palDebut=0,palEcran=null;
function palMax(){return Math.max(0,ST.palmares.saisons.length-PAL_NB);}
function rPalmares(saisonCourante){
  const P=ST.palmares;
  if(!P||P.erreur||!P.saisons)return"";
  // À l'arrivée sur un écran : l'accueil démarre aux saisons les plus récentes, l'écran final sur la saison jouée
  const ecran=saisonCourante?"fin"+saisonCourante:"accueil";
  if(palEcran!==ecran){
    palEcran=ecran;
    const i=saisonCourante?P.saisons.findIndex(s=>s.saison===saisonCourante):0;
    palDebut=Math.min(palMax(),Math.floor(Math.max(0,i)/PAL_NB)*PAL_NB);
  }
  palDebut=Math.max(0,Math.min(palMax(),palDebut));
  const nb=P.saisons.filter(s=>s.pts!==null).length;
  const vue=P.saisons.slice(palDebut,palDebut+PAL_NB);
  const rows=vue.map(s=>{
    const cls=[];if(s.pts===null)cls.push("vide");else if(s.rang===1)cls.push("lead");if(saisonCourante&&s.saison===saisonCourante)cls.push("cur");
    return s.pts===null
      ?`<tr class="${cls.join(" ")}"><td>${s.saison}</td><td>–</td><td>–</td></tr>`
      :`<tr class="${cls.join(" ")}"><td>${s.saison}</td>
        <td><span class="pal-rk">${s.rang===1?"1er":s.rang+"ème"}</span></td>
        <td><span class="pal-pts">${s.pts}<small>pts</small></span></td></tr>`;
  }).join("");
  const nav=P.saisons.length>PAL_NB?`<div class="pal-nav">
      <button type="button" class="pal-ar" data-pal="-1" aria-label="Saisons plus récentes"${palDebut<=0?" disabled":""}>←</button>
      <span class="pal-rg">${vue[0].saison} – ${vue[vue.length-1].saison}</span>
      <button type="button" class="pal-ar" data-pal="1" aria-label="Saisons plus anciennes"${palDebut>=palMax()?" disabled":""}>→</button>
    </div>`:"";
  return`<section class="pal-card${saisonCourante?" fin":""}" data-saison="${saisonCourante||""}">
    <div class="pal-top"><span class="pal-h">Ton palmarès</span><span class="pal-n"><b>${nb}</b> saison${nb>1?"s":""} jouée${nb>1?"s":""} sur ${P.saisons.length}</span></div>
    <table class="pal-tb"><thead><tr><th>Saison</th><th>Classement</th><th>Meilleur total</th></tr></thead><tbody>${rows}</tbody></table>
    ${nav}
  </section>`;
}
// Clic sur une flèche : seule la carte du palmarès est redessinée (le reste de l'écran ne bouge pas)
document.addEventListener("click",ev=>{
  const btn=ev.target.closest?ev.target.closest(".pal-ar"):null;
  if(!btn||btn.disabled||!ST.palmares||!ST.palmares.saisons)return;
  const card=btn.closest(".pal-card");if(!card)return;
  // Pages fixes de 8 saisons ; la dernière page est calée sur la saison la plus ancienne
  const cible=Number(btn.dataset.pal)<0?Math.floor((palDebut-1)/PAL_NB)*PAL_NB:Math.floor(palDebut/PAL_NB)*PAL_NB+PAL_NB;
  palDebut=Math.max(0,Math.min(palMax(),cible));
  card.outerHTML=rPalmares(Number(card.dataset.saison)||0);
});
// Résultat de la partie qui vient de finir : points, place au championnat, équipage,
// puis rang de cette partie parmi tous les joueurs de la saison (dès que le classement est chargé)
function rTaSaison(){
  const ca=champFinal(),pRank=ca.findIndex(e=>e.id==="JOUEUR")+1,pPts=ST.champ["JOUEUR"]||0,saison=ST.sel.carYear;
  const C=ST.classement,ok=C&&!C.erreur,P=ok?C.perso:null,R=ok?C.partie:null,nouveau=!!(P&&P.nouveau);
  const titre=pRank===1?"Champion du monde":(pRank+"ème au championnat");
  const rec=P&&R&&R.rang?`<div class="ts-rec">Cette partie : <b>${rangTxt(R.rang)}</b> sur ${P.nbJoueurs} joueur${P.nbJoueurs>1?"s":""}</div>`:"";
  return`<div class="cl-sec"><div class="cl-lbl">Ta saison <b>${saison}</b></div>
  <div class="ts-card${nouveau?" new":""}">
    <div class="ts-main">
      <div class="ts-pts">${pPts}<small>pts</small></div>
      <div class="ts-mid"><div class="ts-t${pRank===1?" champ":""}">${titre}</div>
        <div class="ts-s">${escH(ST.sel.driver.nom)} / ${escH(ST.sel.codr.nom)} — ${escH(ST.sel.car.nom)}</div></div>
      ${nouveau?`<span class="rec-badge">Nouveau record</span>`:""}
    </div>
    ${rec}
  </div>
  <button id="restart" class="ts-go">Nouvelle saison <span>→</span></button></div>`;
}
function rTop10(){
  const C=ST.classement,saison=ST.sel.carYear;
  const lbl=`<div class="cl-lbl">Top 10 · Saison <b>${saison}</b> — tous joueurs</div>`;
  if(!C)return`<div class="cl-sec">${lbl}<div class="t10-empty">Chargement…</div></div>`;
  if(C.erreur)return`<div class="cl-sec">${lbl}<div class="t10-empty">Classement indisponible pour le moment.</div></div>`;
  let rk=0,prev=null;
  const rows=C.top.map((e,i)=>{
    if(e.pts!==prev){rk=i+1;prev=e.pts;} // ex aequo : même rang, le suivant est sauté
    const cls=["t10-row"];if(rk===1)cls.push("lead");if(e.moi)cls.push("you");if(e.cettePartie)cls.push("cur");
    return`<div class="${cls.join(" ")}"><span class="t10-rk">${rk}</span>
      <div class="t10-mid"><div class="t10-nm"><span class="p">${escH(e.pseudo)}</span>${e.cettePartie?`<span class="t10-tag">Cette partie</span>`:""}</div>
</div>
      <span class="t10-pts">${e.pts}</span></div>`;
  }).join("");
  // Joueur hors du top 10 : son record (rang + points) est rappelé sous la liste
  const horsTop=C.perso&&!C.top.some(e=>e.moi);
  const mien=horsTop?`<div class="t10-sep">· · ·</div><div class="t10-row you"><span class="t10-rk">${C.perso.rang}</span>
      <div class="t10-mid"><div class="t10-nm"><span class="p">Ton record</span></div></div>
      <span class="t10-pts">${C.perso.pts}</span></div>`:"";
  return`<div class="cl-sec">${lbl}<div class="t10">${rows||`<div class="t10-empty">Aucun résultat pour cette saison.</div>`}${mien}</div></div>`;
}
function rResults(){
  return`<div class="hdr">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <a href="/" class="mark"><img src="/logo.svg" alt="" class="brand-logo"><span class="brand-txt"><span class="c1">CHRONO</span><span class="c2">RALLYE</span><span class="c3">RACE</span></span></a>
    </div>
  </div>
  ${rTaSaison()}
  ${rTop10()}
  ${ST.palmares&&ST.palmares.saisons?`<div class="cl-sec">${rPalmares(ST.sel.carYear)}</div>`:""}
  <div style="height:32px"></div>`;
}

function attachEv(){
  const tb=document.getElementById("tirageBtn");if(tb)tb.addEventListener("click",()=>{ST.tirageState="spinning";render();setTimeout(()=>{ST.tirageState="revealed";render();},800);});
  const cb=document.getElementById("chooseBtn");if(cb)cb.addEventListener("click",()=>{if(ST.verrou){render();return;}ST.phase="draft";render();});
  const res=document.getElementById("restart");if(res)res.addEventListener("click",()=>{stopReveal();ST={phase:"rules",draftRound:0,draftOffers:[],rerollUsed:false,riskLevel:null,sel:{},drawn:[],results:[],cur:0,champ:{},showNotes:false,revealed:0,revealing:false,maxReached:0,launching:false,playerName:ST.playerName||"",aEmail:ST.aEmail,emailVerifie:ST.emailVerifie,verrou:ST.verrou,busy:false,fin:null,classement:null,palmares:ST.palmares};render();chargerPalmares();});
}
init();
</script>
