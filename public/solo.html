<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHRONORALLYERACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="theme.css">
<style>



.azbrand{font-family:var(--font-titre);font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:#fff}
.azbrand i{color:var(--accent);font-style:normal}
/* corps de l'app aligné sur le reste du site (Space Mono) */
body{font-family:var(--font-corps);min-height:100vh}
/* Fond photo (podium de fin de rallye) + voile pour la lisibilité.
   Calque fixe DERRIÈRE l'app (#app). L'en-tête et les cartes passent au-dessus. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    linear-gradient(180deg,
      rgba(10,12,15,.5) 0%,
      rgba(10,12,15,.58) 45%,
      rgba(10,12,15,.78) 100%),
    url('/bg-solo.jpg') center/cover no-repeat;
}
.azbrand{text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hdr{background:rgba(18,21,26,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:10}
.pbar{flex:1;height:4px;border-radius:2px}
.year-block{background:var(--accent);border-radius:10px;padding:8px 18px;text-align:center;flex-shrink:0}
.year-lbl{font-size:10px;color:#7c2d12;text-transform:uppercase;letter-spacing:.1em}
.year-num{font-weight:900;font-size:36px;color:#fff;line-height:1}
.tirage-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px;padding:40px 20px;text-align:center}
.step-label{font-size:12px;color:#9ca3af;margin-bottom:10px;text-transform:uppercase;letter-spacing:.12em}
.step-title{font-family:var(--font-titre);font-size:24px;font-weight:700;color:#fff;margin-bottom:32px;text-transform:uppercase;letter-spacing:.02em}
.tirage-btn{display:inline-block;background:var(--accent);border:2px solid var(--accent-soft);border-radius:12px;padding:16px 44px;font-size:17px;font-weight:900;color:#141414;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 28px rgba(249,115,22,.5);transition:all .15s;font-family:var(--font-titre)}
.tirage-btn:hover{background:var(--accent-soft);transform:scale(1.04)}
.tirage-btn:disabled{background:#374151;border-color:#4b5563;color:#9ca3af;cursor:default;transform:none;box-shadow:none}
.choose-btn{display:inline-block;background:var(--accent);border:2px solid var(--accent-soft);border-radius:12px;padding:16px 44px;font-size:17px;font-weight:900;color:#141414;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 24px rgba(249,115,22,.45);transition:all .15s;font-family:var(--font-titre)}
.choose-btn:hover{background:var(--accent-soft);transform:scale(1.04)}
.tirage-sub{font-size:12px;color:#6b7280;margin-top:14px}
.year-reveal{font-family:var(--font-titre);font-size:72px;font-weight:900;color:#fff;line-height:1;margin:20px 0}
.year-reveal.spin{animation:spinIn .6s ease-out forwards}
@keyframes spinIn{0%{opacity:0;transform:scale(.3) rotate(-10deg);color:var(--accent)}60%{transform:scale(1.15) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0deg);color:#fff}}
.result-row{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:3px;border-radius:6px;border:1px solid var(--line);background:rgba(18,21,26,.72);animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.you-badge{font-size:9px;background:#7c3aed22;color:#a78bfa;padding:1px 4px;border-radius:3px;margin-left:3px}
.nav{padding:12px 20px;display:flex;gap:8px}
.nav-btn{flex:1;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:700;cursor:pointer}
.fc-row{display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:3px;border-radius:6px;border:1px solid var(--line);background:rgba(18,21,26,.72)}
.rallye-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:12px 20px}
.rally-card{background:var(--asphalt-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.stats{display:flex;gap:4px;flex-shrink:0}
.stat{text-align:center;min-width:30px}
.stat-k{font-size:9px;color:#6b7280}
.stat-v{font-size:12px;font-weight:700}

/* ============================================================
   HARMONISATION — aligne la page solo sur le style du site
   (comme CRR : Space Mono en corps, Chakra Petch pour les titres
    et les actions, cases sobres à bordure fine et arrondi unifié).
   Les couleurs de jeu ne sont PAS modifiées (surfaces de rallye,
   incidents, couleur du joueur).
   ============================================================ */
/* Titres / gros chiffres → Chakra Petch */
.year-num{font-family:var(--font-titre)}
/* Actions → police titre, comme les boutons du thème */
.nav-btn{font-family:var(--font-titre);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
/* Libellés secondaires → gris du thème au lieu de gris divers */
.step-label,.tirage-sub,.stat-k{color:var(--fog)}
/* Cases : bordure + fond du thème, arrondi unifié (léger) */
.result-row,.fc-row,.rally-card{
  border:1px solid var(--line);
  border-radius:6px;
  background:rgba(21,24,29,.72);
}
.year-block{border-radius:6px}
.nav-btn,.tirage-btn,.choose-btn{border-radius:8px}
/* État désactivé → tokens du thème */
.tirage-btn:disabled{background:#1b1f26;border-color:var(--line);color:var(--fog)}
</style></head><body>
<div id="app"></div>
<script src="solo-data.js"></script>
<script>
const RALLYES=window.SOLO_RALLYES;
const DATA=window.SOLO_DATA;
const YEARS=Object.keys(DATA).map(Number);
const PTS=[25,18,15,12,10,8,6,4,2,1];
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function rndN(a,n){const c=[...a],r=[];for(let i=0;i<n&&c.length;i++){const x=Math.floor(Math.random()*c.length);r.push(c.splice(x,1)[0]);}return r;}
function sc(e,r){return(e.asp*r.asp+e.ter*r.ter+e.nei*r.nei+e.sec*r.sec+e.plu*r.plu+e.rap*r.rap+e.sin*r.sin)/3;}
function basePerf(d,c,v,r){return((sc(d,r)+sc(c,r)+sc(v,r))/3)*(1+(Math.random()*.04-.02));}
function calcInc(car,r){const risk=(1-car.fib)*(1+r.cas),t=Math.random();if(t>risk)return{type:"OK",pen:0};if(t>risk*.67)return{type:"Crevaison",pen:30};if(t>risk*.33)return{type:"Panne",pen:60};return{type:"Abandon",pen:Infinity};}
function fmtG(s){if(s===0)return"-";if(s>=60){const m=Math.floor(s/60),x=(s%60).toFixed(1);return`+${m}m${x.padStart(4,"0")}s`;}return`+${s.toFixed(1)}s`;}
function scol(s){
  if(s.includes("Neige")&&s.includes("Asp"))return"#94a3b8"; // mixte
  if(s.includes("Neige"))return"#f1f5f9";   // blanc neige
  if(s.includes("Asp"))return"#9ca3af";     // gris asphalte
  return"#a16207";                          // marron terre
}
function scolBg(s){
  if(s.includes("Neige")&&s.includes("Asp"))return"#1e2432";
  if(s.includes("Neige"))return"#1e2432";
  if(s.includes("Asp"))return"#1c1c1e";
  return"#1a1208";
}
function vCol(v){return v>=90?"#f59e0b":v>=85?"#60a5fa":"#9ca3af";}
function coS(d){if(!d)return{asp:80,ter:80,nei:80,sec:80,plu:80,rap:80,sin:80,fib:0.85,nom:""};return{asp:d.casp||80,ter:d.cter||80,nei:d.cnei||80,sec:d.csec||80,plu:d.cplu||80,rap:d.crap||80,sin:d.csin||80,fib:d.cfib||0.85,nom:d.cop||""};}

let ST={phase:"rules",draftRound:0,draftOffers:[],rerollUsed:false,riskLevel:null,sel:{},drawn:[],results:[],cur:0,champ:{},showNotes:false,revealed:0,revealing:false,maxReached:0,launching:false,playerName:""};
let revealTimer=null;

function init(){var _u;try{_u=localStorage.getItem('azr_user');}catch(e){}if(!_u){location.replace('/');return;}ST.playerName=_u;ST.phase="rules";ST.draftRound=0;ST.draftOffers=[];ST.rerollUsed=false;ST.riskLevel=null;ST.sel={};render();}

function makeDraftOffers(){
  // Tour 0 = 3 pilotes, Tour 1 = 3 copilotes, Tour 2 = 3 voitures.
  // 3 propositions distinctes, tirées au hasard dans toute l'histoire du WRC.
  const type=ST.draftRound===0?"driver":ST.draftRound===1?"codr":"car";
  const offers=[],seen=new Set();
  let guard=0;
  while(offers.length<3 && guard<300){
    guard++;
    const yr=rnd(YEARS);
    if(type==="driver"){
      const row=rnd(DATA[yr].drivers);
      if(seen.has("d|"+row.nom))continue; seen.add("d|"+row.nom);
      offers.push({type:"driver",nom:row.nom,annee:yr,item:row});
    }else if(type==="codr"){
      const row=rnd(DATA[yr].drivers);
      if(!row.cop||seen.has("c|"+row.cop))continue; seen.add("c|"+row.cop);
      offers.push({type:"codr",nom:row.cop,annee:yr,item:row});
    }else{
      const row=rnd(DATA[yr].cars);
      if(seen.has("v|"+yr+"|"+row.nom))continue; seen.add("v|"+yr+"|"+row.nom);
      offers.push({type:"car",nom:row.nom,annee:yr,item:row});
    }
  }
  return offers;
}

function simulate(){
  const yd=DATA[ST.sel.carYear];
  const carMap={};yd.cars.forEach(c=>{carMap[c.nom]=c;});
  const rivals=yd.drivers.map(d=>{
    const rivalCar=d.voiture?carMap[d.voiture]:null;
    return{id:d.nom,nom:d.nom,cop:d.cop,driver:d,codr:coS(d),car:rivalCar||rnd(yd.cars)};
  });
  if(!ST.sel.driver||!ST.sel.codr||!ST.sel.car){console.error("simulate: missing sel items",ST.sel);return;}
  const riskMods={tresPrudent:{perf:0.98,fib:1.15},prudent:{perf:0.99,fib:1.08},attaque:{perf:1.01,fib:0.92},grosseAttaque:{perf:1.02,fib:0.85}};
  const rMod=riskMods[ST.riskLevel]||{perf:1,fib:1};
  const playerDriver={...ST.sel.driver};
  const playerCar={...ST.sel.car,fib:Math.min(0.99,ST.sel.car.fib*rMod.fib)};
  const player={id:"JOUEUR",nom:ST.sel.driver.nom,cop:ST.sel.codr.nom||"",driver:playerDriver,codr:ST.sel.codr,car:playerCar,isP:true,riskPerfMod:rMod.perf};
  const all=[player,...rivals];
  const champ={};all.forEach(e=>{champ[e.id]=0;});
  ST.results=ST.drawn.map(r=>{
    const comp=all.map(e=>{const p=basePerf(e.driver,e.codr,e.car,r)*(e.riskPerfMod||1),inc=calcInc(e.car,r);return{...e,p,inc,isDNF:inc.type==="Abandon"};});
    let fin=comp.filter(e=>!e.isDNF),dnf=comp.filter(e=>e.isDNF);
    // Si tout le monde abandonne, ressuscite le meilleur performeur
    if(fin.length===0){const best=comp.reduce((a,b)=>a.p>b.p?a:b);best.isDNF=false;best.inc={type:"OK",pen:0};fin=[best];dnf=comp.filter(e=>e!==best);}
    const best=Math.max(...fin.map(e=>e.p));
    fin.forEach(e=>{e.tempsFinal=(best-e.p)*10+e.inc.pen;});
    fin.sort((a,b)=>a.tempsFinal-b.tempsFinal);
    const sorted=[...fin,...dnf];
    sorted.forEach((e,i)=>{e.gap=e.isDNF?Infinity:e.tempsFinal;e.pts=e.isDNF?0:(PTS[i]||0);e.rank=i+1;champ[e.id]=(champ[e.id]||0)+e.pts;});
    return{r,sorted};
  });
  ST.champ=champ;
}

function champSoFar(){
  const map={};
  for(let i=0;i<=ST.cur;i++) ST.results[i].sorted.forEach(e=>{map[e.id]=(map[e.id]||0)+e.pts;});
  return Object.entries(map).map(([id,pts])=>({id,pts})).sort((a,b)=>b.pts-a.pts);
}
function champFinal(){return Object.entries(ST.champ).map(([id,pts])=>({id,pts})).sort((a,b)=>b.pts-a.pts);}

function revealNavChamp(){
  setTimeout(()=>{
    const nav=document.getElementById("simNav");
    const champ=document.getElementById("champBlock");
    const info=document.getElementById("playerInfo");
    if(info){info.style.transition="opacity .6s";info.style.opacity="1";}
    if(nav){nav.style.transition="opacity .6s";nav.style.opacity="1";nav.style.pointerEvents="auto";}
    if(champ){champ.style.transition="opacity .6s";champ.style.opacity="1";}
  },400);
}

function buildRevealOrder(sorted){
  const player=sorted.find(e=>e.isP);
  const others=[...sorted.filter(e=>!e.isP)];
  for(let i=others.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[others[i],others[j]]=[others[j],others[i]];}
  return[player,...others];
}

let revealOrder=[];
let revealedEntries=[];

function makeRowWithGap(e,provRank,provGap,provPts,allRevealed){
  const dnf=e.isDNF,isP=e.isP;
  const hasPen=e.inc?.type==="Crevaison"||e.inc?.type==="Panne";
  const isLead=!dnf&&(e.rank===1)&&!!allRevealed;
  if(provPts===undefined){const PTS_SCALE=[25,18,15,12,10,8,6,4,2,1];provPts=dnf?0:(typeof provRank==="number"?PTS_SCALE[provRank-1]||0:0);}
  const _topName=isP?(ST.playerName||"Joueur"):e.nom;
  const _subLine=isP?`${(e.driver&&e.driver.nom)||e.nom}${e.cop?" · "+e.cop:""}${e.car?" · "+e.car.nom:""}`:`${e.cop}${e.car?" · "+e.car.nom:""}`;
  const div=document.createElement("div");
  div.className="result-row";
  div.style.cssText=`background:${isP?"#1a1020":"#0f1117"};border:1px solid ${isP?"#7c3aed":"#1f2937"};opacity:${dnf?.6:1}`;
  div.dataset.id=e.id;
  div.innerHTML=`
    <span style="width:22px;text-align:right;font-size:12px;font-weight:700;color:${dnf?"#4b5563":"#6b7280"};flex-shrink:0">${dnf?"DNF":provRank}</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:12px;font-weight:${isP?700:500};color:${isP?"#c4b5fd":"#e5e7eb"}">${_topName}${isP?'<span class="you-badge">VOUS</span>':""}</div>
      <div style="font-size:10px;color:#6b7280">${_subLine}</div>
    </div>
    ${hasPen?`<span style="font-size:9px;color:${e.inc.type==="Crevaison"?"#fbbf24":"#f97316"};background:#1f2937;padding:1px 5px;border-radius:3px;flex-shrink:0">${e.inc.type}</span>`:""}
    <div style="text-align:right;min-width:65px;flex-shrink:0">
      <div style="font-size:11px;font-family:monospace;color:${dnf?"#ef4444":"#9ca3af"}">${dnf?"Abandon":isLead?"✓ Vainqueur":fmtG(provGap)}</div>
      ${provPts>0?`<div style="font-size:11px;color:#60a5fa;font-weight:600">+${provPts} pts</div>`:""}
    </div>`;
  return div;
}

function makeRow(e,finalRank){return makeRowWithGap(e,finalRank,e.gap);}

function rebuildList(){
  const container=document.getElementById("revealList");
  if(!container)return;
  const sorted=[...revealedEntries].sort((a,b)=>{
    if(a.isDNF&&!b.isDNF)return 1;if(!a.isDNF&&b.isDNF)return -1;return a.rank-b.rank;
  });
  container.innerHTML="";
  sorted.forEach((e,i)=>{const div=makeRow(e,e.isDNF?"DNF":i+1);div.style.animation="none";container.appendChild(div);});
}

function startReveal(instant){
  if(revealTimer)clearInterval(revealTimer);
  ST.revealed=0;ST.revealing=true;
  revealedEntries=[];
  const sorted=ST.results[ST.cur].sorted;
  const total=sorted.length;
  const container=document.getElementById("revealList");
  if(container)container.innerHTML="";
  if(instant){
    revealedEntries=[...sorted];
    ST.revealed=total;ST.revealing=false;
    const PTS_SCALE_I=[25,18,15,12,10,8,6,4,2,1];
    if(container){container.innerHTML="";sorted.forEach((entry,i)=>{const div=makeRowWithGap(entry,entry.isDNF?"DNF":i+1,entry.gap,entry.isDNF?0:(PTS_SCALE_I[i]||0),true);div.style.animation="none";container.appendChild(div);});}
    const ctr=document.getElementById("revealCounter");if(ctr)ctr.textContent="";
    revealNavChamp();return;
  }
  revealOrder=buildRevealOrder(sorted);
  revealTimer=setInterval(()=>{
    const e=revealOrder[ST.revealed];if(!e)return;
    revealedEntries.push(e);ST.revealed++;
    const container=document.getElementById("revealList");
    if(container){
      const PTS_SCALE=[25,18,15,12,10,8,6,4,2,1];
      const finishers=revealedEntries.filter(x=>!x.isDNF).sort((a,b)=>a.rank-b.rank);
      const dnfs=revealedEntries.filter(x=>x.isDNF);
      const toShow=[...finishers,...dnfs];
      const trueWinnerRevealed=finishers.some(x=>x.rank===1);
      const provLeader=finishers[0];
      container.innerHTML="";
      toShow.forEach((entry,i)=>{
        const provRank=entry.isDNF?"DNF":i+1;
        const provPts=entry.isDNF?0:(PTS_SCALE[i]||0);
        let displayGap;
        if(entry.isDNF)displayGap=Infinity;
        else if(trueWinnerRevealed)displayGap=entry.gap;
        else displayGap=entry.gap-provLeader.gap;
        const div=makeRowWithGap(entry,provRank,displayGap,provPts,false);
        if(entry.id===e.id){div.style.animation="fadeIn .4s ease-out";}else{div.style.animation="none";}
        container.appendChild(div);
      });
    }
    const ctr=document.getElementById("revealCounter");
    if(ctr){const reste=total-ST.revealed;ctr.textContent=reste>0?`${reste} équipage${reste>1?"s":""} restant${reste>1?"s":""}...`:""}
    if(ST.revealed>=total){
      clearInterval(revealTimer);revealTimer=null;ST.revealing=false;
      // Rebuild list with allRevealed=true to show "Vainqueur"
      const finalContainer=document.getElementById("revealList");
      if(finalContainer){
        const PTS_FINAL=[25,18,15,12,10,8,6,4,2,1];
        const finishersF=revealedEntries.filter(x=>!x.isDNF).sort((a,b)=>a.rank-b.rank);
        const dnfsF=revealedEntries.filter(x=>x.isDNF);
        finalContainer.innerHTML="";
        [...finishersF,...dnfsF].forEach((entry,i)=>{
          const div=makeRowWithGap(entry,entry.isDNF?"DNF":i+1,entry.gap,entry.isDNF?0:(PTS_FINAL[i]||0),true);
          div.style.animation="none";finalContainer.appendChild(div);
        });
      }
      const ctr2=document.getElementById("revealCounter");if(ctr2)ctr2.textContent="";
      revealNavChamp();
    }
  },700);
}

function selectDraft(offer){
  // Enregistre le choix avec l'année
  if(offer.type==="driver"){ST.sel.driver=offer.item;ST.sel.driverYear=offer.annee;}
  else if(offer.type==="codr"){ST.sel.codr=coS(offer.item);ST.sel.codrYear=offer.annee;}
  else{ST.sel.car=offer.item;ST.sel.carYear=offer.annee;}

  // Si les 3 types sont choisis → lancer la saison
  if(ST.sel.driver&&ST.sel.codr&&ST.sel.car){
    ST.drawn=rndN(RALLYES,10);
    simulate();
    ST.phase="recap";ST.cur=0;ST.revealed=0;ST.maxReached=0;render();return;
  }

  // Sinon tour suivant
  ST.draftRound++;
  ST.draftOffers=makeDraftOffers();
  render();
}

function goToRally(idx){
  if(revealTimer){clearInterval(revealTimer);revealTimer=null;}
  const isNew=idx>ST.maxReached;
  if(isNew)ST.maxReached=idx;
  ST.cur=idx;ST.revealed=0;
  if(isNew){ST.phase="launch";ST.riskLevel=null;render();}
  else{ST.phase="sim";render();startReveal(true);}
}

function render(){
  const app=document.getElementById("app");
  if(ST.phase==="rules"){app.innerHTML=rRules();attachRulesEv();}
  else if(ST.phase==="draft"){app.innerHTML=rDraft();attachDraftEv();}
  else if(ST.phase==="recap"){app.innerHTML=rRecap();attachRecapEv();}
  else if(ST.phase==="launch"){app.innerHTML=rLaunch();attachLaunchEv();}
  else if(ST.phase==="sim"){app.innerHTML=rSim();attachSimEv();}
  else{app.innerHTML=rResults();attachEv();}
}

function rRules(){
  return`<div class="hdr">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <a href="/menu.html" class="mark"><img src="/logo.svg" alt="" class="brand-logo"><span class="brand-txt"><span class="c1">CHRONO</span><span class="c2">RALLYE</span><span class="c3">RACE</span></span></a>
    </div>
  </div>
  <div style="padding:24px 20px 40px;display:flex;flex-direction:column;align-items:center;text-align:center">
    <div style="font-size:42px;margin-bottom:16px">🏁</div>
    <div style="font-weight:900;font-size:26px;color:#fff;line-height:1.2;margin-bottom:8px">Arriveras-tu à être<br>Champion du Monde ?</div>
    <div style="font-size:14px;color:#9ca3af;margin-bottom:6px">Bienvenue <span style="color:#fbbf24;font-weight:700">${ST.playerName||"Pilote"}</span>.</div>
    <div style="font-size:13px;color:#6b7280;margin-bottom:32px">Constitue ton équipage et lance ta saison.</div>
    <button id="startDraft" style="width:100%;background:#f97316;border:2px solid #fdba74;border-radius:12px;padding:16px;font-size:16px;font-weight:900;color:#141414;cursor:pointer;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 0 24px rgba(249,115,22,.5)">
      Démarrer la draft
    </button>
  </div>`;
}

function attachRulesEv(){
  const btn=document.getElementById("startDraft");

function rDraft(){
  const round=ST.draftRound;
  const offers=ST.draftOffers;
  const typeLabels={driver:"Pilote",codr:"Copilote",car:"Voiture"};
  const roundType=round===0?"driver":round===1?"codr":"car";
  const typeColor=roundType==="driver"?"#60a5fa":roundType==="codr"?"#a78bfa":"#f59e0b";
  const consigne=round===0?"Choisis ton pilote":round===1?"Choisis ton copilote":"Choisis ta voiture";
  const bars=[0,1,2].map(i=>`<div class="pbar" style="background:${i<round?"#dc2626":i===round?"#ef4444":"#1f2937"}"></div>`).join("");

  // Tags des choix déjà faits
  const tags=[];
  if(ST.sel.driver) tags.push(`<div style="background:#1f2937;border:1px solid #374151;border-radius:5px;padding:4px 10px;font-size:11px;color:#e5e7eb"><span style="color:#6b7280">Pilote · </span>${ST.sel.driver.nom}</div>`);
  if(ST.sel.codr) tags.push(`<div style="background:#1f2937;border:1px solid #374151;border-radius:5px;padding:4px 10px;font-size:11px;color:#e5e7eb"><span style="color:#6b7280">Copilote · </span>${ST.sel.codr.nom}</div>`);

  const cards=offers.map((o,i)=>{
    return`<div class="draft-card" data-idx="${i}" style="
      background:#0f1117;
      border:2px solid ${typeColor};
      border-radius:12px;padding:16px;cursor:pointer;
      transition:all .15s;flex:1;min-width:0;
      box-shadow:0 0 12px ${typeColor}22;
    ">
      <div style="font-size:9px;font-weight:700;color:${typeColor};text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px">${typeLabels[o.type]}</div>
      <div style="font-weight:800;font-size:15px;color:#fff;line-height:1.3;margin-bottom:6px">${o.nom}</div>
      <div style="font-size:11px;color:#6b7280">${o.annee}</div>
    </div>`;
  }).join("");

  return`<div class="hdr" style="position:sticky;top:0;z-index:10">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <a href="/menu.html" class="mark"><img src="/logo.svg" alt="" class="brand-logo"><span class="brand-txt"><span class="c1">CHRONO</span><span class="c2">RALLYE</span><span class="c3">RACE</span></span></a>
    </div>
    <div style="display:flex;gap:5px">${bars}</div>
    ${tags.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${tags.join("")}</div>`:""}
  </div>
  <div style="padding:16px 20px 10px">
    <div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px">Tour ${round+1} / 3</div>
    <div style="font-weight:800;font-size:19px;color:#fff;margin-bottom:4px">${consigne}</div>
    <div style="font-size:12px;color:#6b7280;margin-bottom:20px">3 propositions au hasard dans toute l'histoire du WRC${round===2?" — ton choix fixe l'année des concurrents":""}</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${cards}
    </div>
    ${!ST.rerollUsed?`
    <div style="margin-top:16px;text-align:center">
      <button id="rerollBtn" style="background:transparent;border:1px solid #374151;border-radius:8px;padding:8px 20px;font-size:12px;color:#6b7280;cursor:pointer;letter-spacing:.05em;text-transform:uppercase;transition:all .15s">

const KEYS=["asp","ter","nei","sec","plu","rap","sin"];
const LABELS={asp:"Asphalte",ter:"Terre",nei:"Neige",sec:"Sec",plu:"Pluie",rap:"Rapide",sin:"Sinueux"};

function rRecap(){
  const d=ST.sel.driver,c=ST.sel.codr,v=ST.sel.car;

  function getDriverStats(nom,yr){
    const yd=DATA[yr];if(!yd)return null;
    return yd.drivers.find(x=>x.nom===nom)||null;
  }
  function getCopiloteStats(nom,yr){
    const yd=DATA[yr];if(!yd)return null;
    const row=yd.drivers.find(x=>x.cop===nom);
    if(!row)return null;
    return{asp:row.casp,ter:row.cter,nei:row.cnei,sec:row.csec,plu:row.cplu,rap:row.crap,sin:row.csin};
  }
  function getCarStats(nom,yr){
    const yd=DATA[yr];if(!yd)return null;
    return yd.cars.find(x=>x.nom===nom)||null;
  }

  // Récupère les stats avec fallbacks robustes
  const dStats=getDriverStats(d&&d.nom,ST.sel.driverYear)||d||{asp:80,ter:80,nei:80,sec:80,plu:80,rap:80,sin:80};
  const cStats=getCopiloteStats(c&&c.nom,ST.sel.codrYear)||c||{asp:80,ter:80,nei:80,sec:80,plu:80,rap:80,sin:80};
  const vStats=getCarStats(v&&v.nom,ST.sel.carYear)||v||{asp:80,ter:80,nei:80,sec:80,plu:80,rap:80,sin:80};

  // Moyenne des 3 items sur les 7 caractéristiques
  const avg={};
  KEYS.forEach(k=>{
    const dv=Number(dStats[k])||80, cv=Number(cStats[k])||80, vv=Number(vStats[k])||80;
    avg[k]=Math.round((dv+cv+vv)/3);
  });

  // Point fort et faible de l'ensemble
  let best=KEYS[0],worst=KEYS[0];
  KEYS.forEach(k=>{
    if(avg[k]>avg[best])best=k;
    if(avg[k]<avg[worst])worst=k;
  });

  const bloc=(title,nom,annee)=>`
    <div style="background:#0f1117;border:1px solid #1f2937;border-radius:10px;padding:14px 16px;margin-bottom:12px">
      <div style="font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px">${title} · ${annee}</div>
      <div style="font-weight:800;font-size:17px;color:#fff">${nom}</div>
    </div>`;

  return`<div class="hdr">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <a href="/menu.html" class="mark"><img src="/logo.svg" alt="" class="brand-logo"><span class="brand-txt"><span class="c1">CHRONO</span><span class="c2">RALLYE</span><span class="c3">RACE</span></span></a>
    </div>
    <div style="display:flex;gap:5px">${[0,1,2].map(()=>`<div class="pbar" style="background:#dc2626"></div>`).join("")}</div>
  </div>
  <div style="padding:16px 20px 24px">
    <div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px">Votre composition</div>
    <div style="font-weight:800;font-size:20px;color:#fff;margin-bottom:16px">Récapitulatif du draft</div>

    ${bloc("Pilote",d.nom,ST.sel.driverYear)}
    ${bloc("Copilote",c.nom,ST.sel.codrYear)}
    ${bloc("Voiture",v.nom,ST.sel.carYear)}

    <div style="background:#0f1117;border:1px solid #374151;border-radius:10px;padding:14px 16px;margin-bottom:12px">
      <div style="font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px">Force de l'équipage</div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;background:#0a1a0a;border:1px solid #166534;border-radius:8px;padding:10px 12px">
          <div style="font-size:9px;color:#4ade80;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Point fort</div>
          <div style="font-weight:700;font-size:15px;color:#f0fdf4">${LABELS[best]}</div>
          
        </div>
        <div style="flex:1;background:#1a0a0a;border:1px solid #991b1b;border-radius:8px;padding:10px 12px">
          <div style="font-size:9px;color:#f87171;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Point faible</div>
          <div style="font-weight:700;font-size:15px;color:#fef2f2">${LABELS[worst]}</div>
          
        </div>
      </div>
    </div>

    <div style="background:#1a0f0f;border:1px solid #dc2626;border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;color:#9ca3af">Concurrents de la saison :</span>
      <span style="font-weight:900;font-size:22px;color:#ef4444">${ST.sel.carYear}</span>
    </div>

    <button id="startSeason" style="width:100%;background:#f97316;border:2px solid #fdba74;border-radius:12px;padding:15px;font-size:16px;font-weight:900;color:#141414;cursor:pointer;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 0 24px rgba(249,115,22,.5)">
      Démarrer la saison
    </button>
  </div>`;
}

function attachLaunchEv(){
  const riskColors={tresPrudent:"#3b82f6",prudent:"#60a5fa",attaque:"#fb923c",grosseAttaque:"#ef4444"};
  document.querySelectorAll("#riskCards > div").forEach(card=>{
    const col=riskColors[card.dataset.risk]||"#6b7280";
    card.addEventListener("mouseenter",()=>{
      if(ST.riskLevel!==card.dataset.risk){
        card.style.borderColor=col;
        card.style.boxShadow=`0 0 16px ${col}66`;
        card.style.transform="scale(1.03)";
      }
    });
    card.addEventListener("mouseleave",()=>{
      if(ST.riskLevel!==card.dataset.risk){
        card.style.borderColor="#1f2937";
        card.style.boxShadow="none";
        card.style.transform="none";
      }
    });
    card.addEventListener("click",()=>{ST.riskLevel=card.dataset.risk;render();});
  });
  const btn=document.getElementById("launchBtn");
  if(btn){
    btn.addEventListener("mouseenter",()=>{btn.style.background="#ef4444";});
    btn.addEventListener("mouseleave",()=>{btn.style.background="#dc2626";});
    btn.addEventListener("click",()=>{ST.phase="sim";render();startReveal(false);});
  }
}

  return`<div style="background:${isChamp?"linear-gradient(135deg,#78350f,#1a1a0a)":"linear-gradient(135deg,#1a0a0a,#0a0a1a)"};border-bottom:2px solid #dc2626;padding:28px 20px;text-align:center">
    <div style="font-size:44px;margin-bottom:8px">${isChamp?"🏆":pRank<=3?"🥈":"🏁"}</div>
    <div style="font-weight:900;font-size:24px;color:${isChamp?"#fbbf24":"#fff"}">${isChamp?"CHAMPION DU MONDE !":pRank<=3?pRank+"ème — Podium !":pRank+"ème au championnat"}</div>
    <div style="color:#9ca3af;font-size:12px;margin-top:6px">${ST.sel.driver.nom} / ${ST.sel.codr.nom} — ${ST.sel.car.nom}</div>
    <div style="display:inline-block;background:#1f2937;border-radius:8px;padding:6px 20px;margin-top:14px"><span style="color:#6b7280;font-size:11px">Total </span><span style="font-weight:900;font-size:26px;color:#60a5fa">${pPts} pts</span></div>
  </div>
  <div style="padding:12px 20px 0"><div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Résumé des rallyes</div></div>
  <div class="rallye-grid">${summary}</div>
  <div style="padding:0 20px"><div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Classement final championnat ${ST.sel.carYear}</div>${fullChamp}</div>
  <div style="padding:16px 20px 32px"><button id="restart" style="width:100%;background:#f97316;border:none;border-radius:8px;padding:13px;color:#141414;font-size:14px;font-weight:700;cursor:pointer">🔄 Nouvelle saison</button></div>`;
}

function attachEv(){
  const tb=document.getElementById("tirageBtn");if(tb)tb.addEventListener("click",()=>{ST.tirageState="spinning";render();setTimeout(()=>{ST.tirageState="revealed";render();},800);});
  const cb=document.getElementById("chooseBtn");if(cb)cb.addEventListener("click",()=>{ST.phase="draft";render();});
  const res=document.getElementById("restart");if(res)res.addEventListener("click",()=>{if(revealTimer){clearInterval(revealTimer);revealTimer=null;}ST={phase:"rules",draftRound:0,draftOffers:[],rerollUsed:false,riskLevel:null,sel:{},drawn:[],results:[],cur:0,champ:{},showNotes:false,revealed:0,revealing:false,maxReached:0,launching:false,playerName:ST.playerName||""};render();});
}
init();
</script>
</body></html>
